<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lektion 2: Bygglabbet – Rättvisa Test – Naturkunskap 1a1</title>
  <style>
    :root {
      --bg-main: #12161c;
      --bg-card: #1b222c;
      --bg-card-alt: #232c38;
      --bg-input: #101419;

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-badge">Lektion 2 av 3</span>

      <button type="button" class="btn-tts" id="btnAutoTts" onclick="toggleAutoTts()">

        ⏹ Stoppa ljud
      </button>

      <span id="stageLabel">Start: Par-incheckning</span>

      <div class="progress-bar-fill" id="progressBar"></div>

<main id="appContainer"></main>

<div id="toast"></div>

<script>
/* =========================================================
   1. SWEDISH TEXT-TO-SPEECH (CHROMEBOOK OPTIMIZED)
   ========================================================= */
let svVoice = null;
let autoTts = false;
let currentSpeakBtn = null;

function loadSwedishVoices() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return;

  svVoice =
    voices.find(v => v.lang.toLowerCase() === 'sv-se' && v.name.toLowerCase().includes('google')) ||
    voices.find(v => v.lang.toLowerCase() === 'sv-se') ||
    voices.find(v => v.lang.toLowerCase().startsWith('sv')) ||
    null;
}

if ('speechSynthesis' in window) {
  loadSwedishVoices();
  window.speechSynthesis.onvoiceschanged = loadSwedishVoices;
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  if (currentSpeakBtn) {
    currentSpeakBtn.classList.remove('speaking');
    currentSpeakBtn = null;
  }
}

function speakText(text, btnEl = null) {
  if (!('speechSynthesis' in window)) {
    showToast("Din webbläsare stöder tyvärr inte uppläsning.");
    return;
  }
  stopSpeech();
  loadSwedishVoices();

  const cleanText = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  if (!cleanText) return;

  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = 'sv-SE';
  if (svVoice) utterance.voice = svVoice;
  utterance.rate = 0.96;
  utterance.pitch = 1.0;

  if (btnEl) {
    currentSpeakBtn = btnEl;
    btnEl.classList.add('speaking');
  }

  utterance.onend = () => {
    if (btnEl) btnEl.classList.remove('speaking');
    if (currentSpeakBtn === btnEl) currentSpeakBtn = null;
  };
  utterance.onerror = () => {
    if (btnEl) btnEl.classList.remove('speaking');
    if (currentSpeakBtn === btnEl) currentSpeakBtn = null;
  };

  window.speechSynthesis.speak(utterance);
}

function toggleAutoTts() {
  autoTts = !autoTts;
  const btn = document.getElementById('btnAutoTts');
  btn.textContent = autoTts ? '🔊 Auto-uppläsning: PÅ' : '🔊 Auto-uppläsning: AV';
  btn.style.borderColor = autoTts ? 'var(--green)' : '';
  if (autoTts) {
    speakText("Automatisk uppläsning är nu påslagen.");
  } else {
    stopSpeech();
  }
}

function ttsButton(textToRead, label = "Lyssna") {
  const safe = textToRead.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  return `<button type="button" class="btn-tts" onclick="speakText('${safe}', this)">🔊 ${label}</button>`;
}

/* =========================================================
   2. ANTI-PASTE & TOAST GUARDRAILS
   ========================================================= */
let toastTimeout = null;
function showToast(msg, isSuccess = false) {
  const el = document.getElementById('toast');
  el.style.backgroundColor = isSuccess ? '#14532d' : '#991b1b';
  el.style.borderColor = isSuccess ? '#22c55e' : '#f87171';
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    el.style.display = 'none';
  }, 3600);
}

function attachAntiPaste(el) {
  if (!el) return;
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    showToast("🚫 Klistra in är avstängt! Skriv svaret med era egna ord.");
  });
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    showToast("🚫 Dra-och-släpp text är avstängt! Skriv med egna ord.");
  });

  let lastVal = el.value || '';
  el.addEventListener('input', () => {
    const diff = el.value.length - lastVal.length;
    if (diff > 18) {
      el.value = lastVal;
      showToast("🚫 För många tecken på en gång! Skriv svaret själva.");
    } else {
      lastVal = el.value;
    }
  });
}

function wireAllNoPasteInputs() {
  document.querySelectorAll('.no-paste').forEach(attachAntiPaste);
}

function insertStarter(textareaId, starterText) {
  const el = document.getElementById(textareaId);
  if (!el) return;
  el.value = starterText;
  el.focus();
  // Trigger input event so lastVal syncs properly
  el.dispatchEvent(new Event('input'));
}

/* =========================================================
   3. APP STATE & CURRICULUM DATA (FRESH SCENARIOS ONLY)
   ========================================================= */
const state = {
  stage: 0, // 0: Start, 1: Sabotage-detektiven, 2: Kontroll- & Behandlingsgrupp, 3: Hypotes-verkstaden, 4: Designa E-experiment, 5: Muntligt Genrep, 6: Bonus C/A, 7: Sammanfattning
  startTime: Date.now(),
  student1: '',
  student2: '',
  classGroup: '',

  // Class Walkthrough / Overview Mode (toggled via Shift+L)
  teacherMode: false,
  teacherOverviewExpanded: true,

  // Stage 1: Sabotage Spotter (Fair Tests)
  s1Index: 0,
  s1Score: 0,
  s1Answered: false,
  s1ChosenIdx: null,
  pair1Text: '',
  pair1Spoken: false,

  // Stage 2: Control vs Treatment Group
  s2DefAnswered: false,
  s2DefCorrect: false,
  s2CaseIndex: 0,
  s2CaseAnswered: false,
  s2CaseChosenIdx: null,
  s2CaseScore: 0,
  s2WhyAnswered: false,
  s2WhyCorrect: false,

  // Stage 3: Hypothesis Workshop
  s3Fix1Done: false,
  s3Fix2Done: false,
  hypo1Text: '',
  hypo2Text: '',
  pair2Spoken: false,

  // Stage 4: Design Your Own E-Level Experiment
  selectedScenario: 'vest', // 'vest' or 'glue'
  expTreat: '',
  expCtrl: '',
  expSame: '',
  expMeasure: '',
  expWhyReliable: '',

  // Stage 5: Oral Rehearsal
  s5Index: 0,
  s5Revealed: false,
  s5Ratings: [],
  s5TimerVal: 45,
  s5TimerRunning: false,

  // Stage 6: Optional C/A Bonus (Placebo & Blind Study)
  didBonus: false,
  caBlindAnswered: false,
  caBlindCorrect: false,
  caText: ''
};

let oralInterval = null;

const stageMeta = [
  { name: "Start: Par-incheckning", short: "Start", pct: 0, time: "Ca 40 min totalt" },
  { name: "Etapp 1: Sabotage-detektiven (Rättvisa test)", short: "Etapp 1: Rättvisa test", pct: 15, time: "~8 min" },
  { name: "Etapp 2: Behandlingsgrupp & Kontrollgrupp", short: "Etapp 2: Kontrollgrupp", pct: 32, time: "~8 min" },
  { name: "Etapp 3: Hypotes-verkstaden", short: "Etapp 3: Hypoteser", pct: 50, time: "~8 min" },
  { name: "Etapp 4: Bygg ert eget E-experiment", short: "Etapp 4: Designa försök", pct: 68, time: "~7 min" },
  { name: "Etapp 5: Muntligt genrep (E-nivå)", short: "Etapp 5: Muntligt", pct: 84, time: "~5 min" },
  { name: "Bonus-etapp: Sikta mot C/A (Blindstudie)", short: "Bonus C/A", pct: 94, time: "~4 min (Valfri)" },
  { name: "Klar! Kopiera till Google Classroom", short: "Sammanfattning", pct: 100, time: "Färdig!" }
];

// STAGE 1 DATA: Sabotage-detektiven (Spotting bad experimental design)
const s1Cases = [
  {

/* =========================================================
   4. CLASS OVERVIEW & WALKTHROUGH MODE (Shift+L / Shift+F)
   ========================================================= */
document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (e.shiftKey && (e.code === 'KeyL' || e.key === 'L' || e.key === 'l')) {
    e.preventDefault();
    toggleTeacherMode();
  } else if (e.shiftKey && (e.code === 'KeyF' || e.key === 'F' || e.key === 'f')) {
    e.preventDefault();
    demoForwardStep();
  }
});

function toggleTeacherMode() {
  state.teacherMode = !state.teacherMode;
  if (state.teacherMode) {
    state.teacherOverviewExpanded = true;
    showToast("📋 Lektionsöversikt visad för genomgång!", true);
  } else {
    showToast("Lektionsöversikt stängd.");
  }
  render();
}

function jumpToStage(targetStage) {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  state.stage = targetStage;
  render();
}

function demoForwardStep() {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";

  if (state.stage === 0) {
    if (!state.classGroup) state.classGroup = "BA23A";
    state.stage = 1;
    render();
    return;
  }

  if (state.stage === 1) {
    if (state.s1Index < s1Cases.length) {
      if (!state.s1Answered) {
        const correctIdx = s1Cases[state.s1Index].options.findIndex(o => o.correct);
        answerS1(correctIdx);
      } else {
        nextS1();
      }
    } else {
      if (!state.pair1Text || state.pair1Text.length < 15) {
        state.pair1Text = "För att ett test ska vara rättvist får man bara ändra en faktor i taget, man måste ha en kontrollgrupp och försöket ska gå att upprepa.";
      }
      state.pair1Spoken = true;
      state.stage = 2;
      render();
    }
    return;
  }

  if (state.stage === 2) {
    if (!state.s2DefCorrect) {
      answerS2Def(true);
    } else if (state.s2CaseIndex < s2Cases.length) {
      if (!state.s2CaseAnswered) {
        const correctIdx = s2Cases[state.s2CaseIndex].options.findIndex(o => o.correct);
        answerS2Case(correctIdx);
      } else if (state.s2CaseIndex < s2Cases.length - 1) {
        state.s2CaseIndex++;
        state.s2CaseAnswered = false;
        state.s2CaseChosenIdx = null;
        render();
      } else if (!state.s2WhyCorrect) {
        answerS2Why(true);
      } else {
        state.stage = 3;
        render();
      }
    }
    return;
  }

  if (state.stage === 3) {
    if (!state.s3Fix1Done) {
      state.s3Fix1Done = true;
      render();
    } else if (!state.s3Fix2Done) {
      state.s3Fix2Done = true;
      render();
    } else {
      if (!state.hypo1Text || state.hypo1Text.length < 15) {
        state.hypo1Text = "Träreglar som limmas med det nya fukttåliga limmet håller ihop bättre efter en vecka i regn än reglar med vanligt lim.";
      }
      if (!state.hypo2Text || state.hypo2Text.length < 15) {
        state.hypo2Text = "Snickare som bär en påslagen värmeväst fryser mindre och spikar fler reglar i timmen vid 0 grader än snickare utan värmeväst.";
      }
      state.pair2Spoken = true;
      state.stage = 4;
      render();
    }
    return;
  }

  if (state.stage === 4) {
    const sc = expScenarios[state.selectedScenario];
    if (!state.expTreat || !state.expCtrl || !state.expSame || !state.expMeasure) {
      state.expTreat = sc.treatOptions[0];
      state.expCtrl = sc.ctrlOptions[0];
      state.expSame = sc.sameOptions[0];
      state.expMeasure = sc.measureOptions[0];
      render();
    } else {
      if (!state.expWhyReliable || state.expWhyReliable.length < 15) {
        state.expWhyReliable = sc.demoWhy;
      }
      state.stage = 5;
      render();
    }
    return;
  }

  if (state.stage === 5) {
    if (!state.s5Revealed) {
      revealOral();
    } else {
      rateOral('green');
    }
    return;
  }

  if (state.stage === 6) {
    if (!state.caBlindCorrect) {
      answerCaBlind(true);
    } else {
      if (!state.caText || state.caText.length < 10) {
        state.caText = "I en blindstudie vet inte försökspersonerna om de har en påslagen värmeväst eller en avstängd väst (placebo), så förväntningar påverkar inte resultatet.";
      }
      state.didBonus = true;
      state.stage = 7;
      render();
    }
    return;
  }

  if (state.stage === 7) {
    showToast("Ni är redan på sista sidan (Sammanfattning)!", true);
  }
}

  else if (state.stage === 6) html += renderStage6();

    c.options.forEach((opt, idx) => {
      let cls = 'option-btn';
      if (state.s1Answered) {
        if (opt.correct) cls += ' correct';
        else if (state.s1ChosenIdx === idx) cls += ' wrong';
      }
      optsHtml += `
        <button type="button" class="${cls}" ${state.s1Answered ? 'disabled' : ''} onclick="answerS1(${idx})">
          ${escapeHtml(opt.text)}
        </button>
      `;
    });

    const isLast = state.s1Index === s1Cases.length - 1;
    const isCorrect = state.s1Answered && c.options[state.s1ChosenIdx]?.correct;

    return `
      <div class="card">
        <div class="card-header-row">
          <div>
            <span class="tag tag-e">E-nivå • ${c.badge}</span>
            <h2>Sabotage-detektiven: ${escapeHtml(c.title)}</h2>
          </div>
          ${ttsButton(fullAudio, "Lyssna")}
        </div>

        <div style="background: var(--bg-card-alt); border-left: 5px solid var(--accent); padding: 18px; border-radius: 10px; margin: 14px 0;" data-autoread="${fullAudio.replace(/"/g, '&quot;')}">
          ${escapeHtml(c.scenario)}
        </div>

        <p style="font-weight: 700; font-size: 1.1rem;">${escapeHtml(c.question)}</p>

        <div class="options-grid">
          ${optsHtml}
        </div>

        <div class="feedback-box ${state.s1Answered ? 'show ' + (isCorrect ? 'ok' : 'err') : ''}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div>
              <strong>${isCorrect ? '✅ Helt rätt!' : '💡 Kolla vad som gick snett:'}</strong><br/>
              ${escapeHtml(c.explanation)}
            </div>
            ${ttsButton(c.explanation, "Lyssna")}
          </div>
        </div>

        <div class="nav-footer">
          <span style="color: var(--text-muted);">Poäng i etappen: ${state.s1Score} / ${s1Cases.length}</span>
          ${state.s1Answered ? `
            <button type="button" class="btn-primary" onclick="nextS1()">
              ${isLast ? 'Till Par-snack #1 →' : 'Nästa fall →'}
            </button>
          ` : ''}
        </div>
      </div>
    `;
  } else {
    const pairPrompt = "Par-snack 1: Turas om att berätta högt för varandra. Vilka tre regler gör att ett experiment blir rättvist och pålitligt? Skriv sedan ner er korta sammanfattning.";
    return `
      <div class="card">
        <div class="card-header-row">
          <div>
            <span class="tag tag-pair">🗣️ Par-snack #1 • Rättvisa experiment</span>
            <h2>Sammanfatta högt för varandra!</h2>
          </div>
          ${ttsButton(pairPrompt, "Lyssna")}
        </div>
        <p data-autoread="${pairPrompt.replace(/"/g, '&quot;')}">
          Utifrån de fyra fallen ni nyss löste: berätta högt för varandra vad som krävs för att ett vetenskapligt experiment ska vara pålitligt (t.ex. ändra en faktor i taget, ha kontrollgrupp, upprepbart, många försök).
        </p>

        <div class="pair-box">
          <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med era egna ord</div>
          <label for="txtPair1">Skriv ner minst två saker som gör ett experiment rättvist och pålitligt:</label>
          <div class="starter-chips">
            <button type="button" class="chip-btn" onclick="insertStarter('txtPair1', 'För att ett experiment ska vara pålitligt måste man ')">
              + Starta meningen
            </button>
          </div>
          <textarea id="txtPair1" class="no-paste" rows="3" placeholder="För att ett experiment ska vara pålitligt måste man...">${escapeHtml(state.pair1Text)}</textarea>

          <label class="checkbox-row">
            <input type="checkbox" id="chkPair1" ${state.pair1Spoken ? 'checked' : ''} />
            <span>Vi har pratat igenom svaret högt med varandra!</span>
          </label>
        </div>

        <div class="nav-footer">
          <button type="button" class="btn-secondary" onclick="state.s1Index = 0; state.s1Answered = false; render();">← Gör om fallen</button>
          <button type="button" class="btn-primary" onclick="finishStage1()">Vidare till Etapp 2 →</button>
        </div>
      </div>
    `;
  }
}

function answerS1(idx) {
  if (state.s1Answered) return;
  state.s1Answered = true;
  state.s1ChosenIdx = idx;
  if (s1Cases[state.s1Index].options[idx].correct) {
    state.s1Score++;
  }
  render();
  if (autoTts) speakText(s1Cases[state.s1Index].explanation);
}

function nextS1() {
  state.s1Index++;
  state.s1Answered = false;
  state.s1ChosenIdx = null;
  render();
}

function finishStage1() {
  const txt = document.getElementById('txtPair1').value.trim();
  const chk = document.getElementById('chkPair1').checked;
  if (txt.length < 15) {
    showToast("Skriv minst en mening i rutan innan ni går vidare!");
    return;
  }
  if (!chk) {
    showToast("Kryssa i rutan när ni har pratat igenom svaret högt!");
    return;
  }
  state.pair1Text = txt;
  state.pair1Spoken = true;
  state.stage = 2;
  render();
}

/* --- STAGE 2: BEHANDLINGSGRUPP & KONTROLLGRUPP --- */
function renderStage2() {
  const c = s2Cases[state.s2CaseIndex];
  const introAudio = "Etapp 2: Behandlingsgrupp och kontrollgrupp. På provet måste ni kunna förklara vad en kontrollgrupp är och varför den behövs.";

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-e">E/C-nivå • Viktig provfråga!</span>
          <h2>Behandlingsgrupp & Kontrollgrupp</h2>
        </div>
        ${ttsButton(introAudio, "Lyssna")}
      </div>

      <h3>Del 1: Vad är en kontrollgrupp?</h3>
      <div class="options-grid">
        <button type="button" class="option-btn ${state.s2DefAnswered ? (state.s2DefCorrect ? 'correct' : 'wrong') : ''}"
          onclick="answerS2Def(true)">
          En försöksgrupp som INTE utsätts för någon behandling eller får någon verksam substans (den grupp man jämför med).
        </button>
        <button type="button" class="option-btn ${state.s2DefAnswered && !state.s2DefCorrect ? 'wrong' : ''}"
          onclick="answerS2Def(false)">
          Den grupp som får dubbel dos av det nya medlet som testas.
        </button>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0;" />

      <h3>Del 2: Praktiska bygg-test (${state.s2CaseIndex + 1} av ${s2Cases.length})</h3>
      <div style="background: var(--bg-card-alt); border-left: 5px solid var(--blue); padding: 18px; border-radius: 10px; margin: 12px 0;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>
            <strong>${escapeHtml(c.title)}</strong>
            <p style="margin: 8px 0 0 0;">${escapeHtml(c.desc)}</p>
          </div>
          ${ttsButton(`${c.title}. ${c.desc}. ${c.question}`, "Lyssna")}
        </div>
      </div>

      <p><strong>${escapeHtml(c.question)}</strong></p>
      <div class="options-grid">
        ${c.options.map((opt, idx) => {
          let cls = 'option-btn';
          if (state.s2CaseAnswered) {
            if (opt.correct) cls += ' correct';
            else if (state.s2CaseChosenIdx === idx) cls += ' wrong';
          }
          return `<button type="button" class="${cls}" ${state.s2CaseAnswered ? 'disabled' : ''} onclick="answerS2Case(${idx})">${escapeHtml(opt.text)}</button>`;
        }).join('')}
      </div>

      <div class="feedback-box ${state.s2CaseAnswered ? 'show ' + (c.options[state.s2CaseChosenIdx]?.correct ? 'ok' : 'err') : ''}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>${escapeHtml(c.explanation)}</div>
          ${ttsButton(c.explanation, "Lyssna")}
        </div>
      </div>

      ${state.s2CaseAnswered && state.s2CaseIndex < s2Cases.length - 1 ? `
        <div style="margin-top: 14px;">
          <button type="button" class="btn-secondary" onclick="state.s2CaseIndex++; state.s2CaseAnswered = false; state.s2CaseChosenIdx = null; render();">
            Nästa bygg-test (Scenario B) →
          </button>
        </div>
      ` : ''}

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0;" />

      <h3>Del 3 (C-nivå): Varför är kontrollgruppen så viktig i försöket med handskarna eller sulorna?</h3>
      <div class="options-grid">
        <button type="button" class="option-btn ${state.s2WhyAnswered ? (state.s2WhyCorrect ? 'correct' : 'wrong') : ''}"
          onclick="answerS2Why(true)">
          Kontrollgruppen behövs för att veta hur det fungerar UTAN behandlingen (t.ex. hur blöta handskarna blir utan spray). Effekten får vi fram genom att jämföra behandlingsgruppen med kontrollgruppen.
        </button>
        <button type="button" class="option-btn ${state.s2WhyAnswered && !state.s2WhyCorrect ? 'wrong' : ''}"
          onclick="answerS2Why(false)">
          Kontrollgruppen behövs bara för att det ska se snyggt ut i en tabell.
        </button>
      </div>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 1; render();">← Tillbaka</button>
        <button type="button" class="btn-primary" onclick="finishStage2()">Vidare till Etapp 3 (Hypoteser) →</button>
      </div>
    </div>
  `;
}

function answerS2Def(isOk) {
  state.s2DefAnswered = true;
  state.s2DefCorrect = isOk;
  if (!isOk) showToast("Nja! Kontrollgruppen är den grupp som INTE får någon behandling.");
  render();
}

function answerS2Case(idx) {
  if (state.s2CaseAnswered) return;
  state.s2CaseAnswered = true;
  state.s2CaseChosenIdx = idx;
  if (s2Cases[state.s2CaseIndex].options[idx].correct) {
    state.s2CaseScore++;
  }
  render();
  if (autoTts) speakText(s2Cases[state.s2CaseIndex].explanation);
}

function answerS2Why(isOk) {
  state.s2WhyAnswered = true;
  state.s2WhyCorrect = isOk;
  if (!isOk) showToast("Tänk efter: hur vet vi att sprayen eller sulan gjorde skillnad om vi inte har något att jämföra med?");
  render();
}

function finishStage2() {
  if (!state.s2DefCorrect) {
    showToast("Svara rätt på Del 1 (vad en kontrollgrupp är) först!");
    return;
  }
  if (state.s2CaseIndex < s2Cases.length - 1 || !state.s2CaseAnswered) {
    showToast("Gör klart båda bygg-testen i Del 2 först!");
    return;
  }
  if (!state.s2WhyCorrect) {
    showToast("Svara rätt på Del 3 (varför kontrollgruppen är viktig) först!");
    return;
  }
  state.stage = 3;
  render();
}

/* --- STAGE 3: HYPOTES-VERKSTADEN --- */
function renderStage3() {
  const audioIntro = "Etapp 3: Hypotes-verkstaden. Kom ihåg regeln: En hypotes ska formuleras som ett tydligt påstående som går att testa, aldrig som en fråga.";

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-e">E-nivå • Skriv egna hypoteser</span>
          <h2>Hypotes-verkstaden</h2>
        </div>
        ${ttsButton(audioIntro, "Lyssna")}
      </div>

      <div style="background: var(--blue-bg); border: 1px solid rgba(56,189,248,0.4); padding: 14px 16px; border-radius: 10px; margin-bottom: 18px;">
        <strong>💡 Gyllene regeln på provet:</strong><br/>
        Skriv <strong>INTE</strong> en fråga (<em>”Funkar värmevästen?”</em>).<br/>
        Skriv ett <strong>PÅSTÅENDE</strong> som går att mäta (<em>”Snickare som bär en påslagen värmeväst fryser mindre i 0 grader än snickare utan värmeväst.”</em>).
      </div>

      <h3>Steg 1: Gör om frågan till en hypotes</h3>
      <p><strong>Uppgift A:</strong> En elev frågar: <em>”Blir man snabbare i reaktionerna av kaffe?”</em> – Vilken hypotes är rätt?</p>
      <div class="options-grid two-col">
        <button type="button" class="option-btn ${state.s3Fix1Done ? 'correct' : ''}" onclick="state.s3Fix1Done = true; render();">
          ✅ Personer som dricker en kopp kaffe får snabbare reaktionstid än personer som dricker vatten.
        </button>
        <button type="button" class="option-btn" onclick="showToast('Det där är fortfarande en fråga! Välj påståendet.')">
          ❌ Hur mycket kaffe måste man dricka för att bli pigg?
        </button>
      </div>

      <p style="margin-top: 16px;"><strong>Uppgift B:</strong> En elev frågar: <em>”Hjälper blåljusglasögon mot trötta ögon vid skärmarbete?”</em> – Vilken hypotes är rätt?</p>
      <div class="options-grid two-col">
        <button type="button" class="option-btn" onclick="showToast('Det där är en åsikt, inte en testbar hypotes!')">
          ❌ Blåljusglasögon ser coola ut på kontoret.
        </button>
        <button type="button" class="option-btn ${state.s3Fix2Done ? 'correct' : ''}" onclick="state.s3Fix2Done = true; render();">
          ✅ Personer som använder blåljusglasögon vid 3 timmars skärmarbete får mindre ögontrötthet än personer utan glasögon.
        </button>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0;" />

      <h3>Steg 2: Skriv TVÅ egna hypoteser tillsammans!</h3>
      <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med era egna ord</div>

      <label for="txtHypo1">1. Ni ska testa ett <strong>nytt fukttåligt trälim</strong> jämfört med vanligt trälim i regn. Skriv er hypotes som ett påstående:</label>
      <div class="starter-chips">
        <button type="button" class="chip-btn" onclick="insertStarter('txtHypo1', 'Träreglar som limmas med det nya fukttåliga limmet ')">
          + Träreglar som limmas med...
        </button>
      </div>
      <textarea id="txtHypo1" class="no-paste" rows="2" placeholder="T.ex. Träreglar som limmas med det nya limmet håller ihop bättre i fukt än...">${escapeHtml(state.hypo1Text)}</textarea>

      <label for="txtHypo2" style="margin-top: 10px;">2. Ni ska testa om en <strong>batteridriven värmeväst</strong> hjälper snickare som jobbar utomhus i kyla. Skriv er hypotes som ett påstående:</label>
      <div class="starter-chips">
        <button type="button" class="chip-btn" onclick="insertStarter('txtHypo2', 'Snickare som bär en påslagen värmeväst i kyla ')">
          + Snickare som bär...
        </button>
      </div>
      <textarea id="txtHypo2" class="no-paste" rows="2" placeholder="T.ex. Snickare som bär värmeväst i kyla fryser mindre och jobbar snabbare än...">${escapeHtml(state.hypo2Text)}</textarea>

      <div class="pair-box">
        <span class="tag tag-pair">🗣️ Par-snack #2 • Läs upp era hypoteser</span>
        <p style="margin: 4px 0 8px 0;">Läs upp era två hypoteser högt för varandra och kolla: <strong>Är de skrivna som påståenden (utan frågetecken)?</strong></p>
        <label class="checkbox-row">
          <input type="checkbox" id="chkPair2" ${state.pair2Spoken ? 'checked' : ''} />
          <span>Vi har läst upp båda hypoteserna högt och kollat att de är påståenden!</span>
        </label>
      </div>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 2; render();">← Tillbaka</button>
        <button type="button" class="btn-primary" onclick="finishStage3()">Vidare till Etapp 4 →</button>
      </div>
    </div>
  `;
}

function finishStage3() {
  if (!state.s3Fix1Done || !state.s3Fix2Done) {
    showToast("Klicka fram rätt hypotes på både Uppgift A och Uppgift B i Steg 1!");
    return;
  }
  const h1 = document.getElementById('txtHypo1').value.trim();
  const h2 = document.getElementById('txtHypo2').value.trim();
  const chk = document.getElementById('chkPair2').checked;

  if (h1.length < 15 || h2.length < 15) {
    showToast("Skriv båda hypoteserna i textrutorna innan ni går vidare!");
    return;
  }
  if (h1.endsWith('?') || h2.endsWith('?')) {
    showToast("Obs! En hypotes får inte sluta med frågetecken (?). Gör om till ett påstående!");
    return;
  }
  if (!chk) {
    showToast("Kryssa i rutan när ni har läst upp hypoteserna högt!");
    return;
  }

  state.hypo1Text = h1;
  state.hypo2Text = h2;
  state.pair2Spoken = true;
  state.stage = 4;
  render();
}

/* --- STAGE 4: BYGG ERT EGET E-EXPERIMENT --- */
function renderStage4() {
  const sc = expScenarios[state.selectedScenario];
  const audioIntro = `Etapp 4: Bygg ert eget experiment. Välj ett av de två bygg-scenarierna och sätt ihop ett pålitligt försök med behandlingsgrupp, kontrollgrupp och motivering.`;

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-e">E/C-nivå • Motsvarar provets stora planeringsfråga</span>
          <h2>Bygg ert eget experiment</h2>
        </div>
        ${ttsButton(audioIntro, "Lyssna")}
      </div>

      <p><strong>1. Välj vilket försök ni vill planera:</strong></p>
      <div class="options-grid two-col" style="margin-bottom: 18px;">
        <button type="button" class="option-btn ${state.selectedScenario === 'vest' ? 'selected' : ''}" onclick="selectExpScenario('vest')">
          🧥 Alternativ A: Värmeväst vid arbete i kyla
        </button>
        <button type="button" class="option-btn ${state.selectedScenario === 'glue' ? 'selected' : ''}" onclick="selectExpScenario('glue')">
          🪵 Alternativ B: Nytt fukttåligt trälim i regn
        </button>
      </div>

      <div style="background: var(--bg-card-alt); padding: 16px; border-radius: 10px; border-left: 5px solid var(--accent); margin-bottom: 18px;">
        <strong>Uppdrag:</strong> ${escapeHtml(sc.question)}
      </div>

      <div class="group-grid">
        <div class="group-box treat">
          <h3>🟠 Behandlingsgrupp</h3>
          <p style="font-size: 0.95rem; color: var(--text-muted);">Vilka får behandlingen som ska testas?</p>
          <select id="selTreat" onchange="state.expTreat = this.value">
            <option value="">-- Välj behandlingsgrupp --</option>
            ${sc.treatOptions.map(o => `<option value="${escapeHtml(o)}" ${state.expTreat === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
          </select>
        </div>

        <div class="group-box ctrl">
          <h3>🔵 Kontrollgrupp</h3>
          <p style="font-size: 0.95rem; color: var(--text-muted);">Vilka är jämförelsegruppen utan behandling?</p>
          <select id="selCtrl" onchange="state.expCtrl = this.value">
            <option value="">-- Välj kontrollgrupp --</option>
            ${sc.ctrlOptions.map(o => `<option value="${escapeHtml(o)}" ${state.expCtrl === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
          </select>
        </div>
      </div>

      <label for="selSame"><strong>2. Vad måste hållas exakt likadant för båda grupperna?</strong></label>
      <select id="selSame" onchange="state.expSame = this.value">
        <option value="">-- Välj vad som hålls lika --</option>
        ${sc.sameOptions.map(o => `<option value="${escapeHtml(o)}" ${state.expSame === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
      </select>

      <label for="selMeasure"><strong>3. Hur mäter ni resultatet?</strong></label>
      <select id="selMeasure" onchange="state.expMeasure = this.value">
        <option value="">-- Välj mätmetod --</option>
        ${sc.measureOptions.map(o => `<option value="${escapeHtml(o)}" ${state.expMeasure === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
      </select>

      <div class="pair-box">
        <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med era egna ord</div>
        <label for="txtExpWhy"><strong>4. Motivera (E/C-nivå):</strong> Varför behövs kontrollgruppen i ert försök, och vad gör att ert experiment ger ett pålitligt resultat?</label>
        <div class="starter-chips">
          <button type="button" class="chip-btn" onclick="insertStarter('txtExpWhy', 'Kontrollgruppen behövs för att jämföra hur det går utan behandlingen. Experimentet blir pålitligt eftersom vi bara ändrar en faktor och ')">
            + Starta motiveringen
          </button>
        </div>
        <textarea id="txtExpWhy" class="no-paste" rows="3" placeholder="Kontrollgruppen behövs för att... Vårt experiment blir pålitligt eftersom...">${escapeHtml(state.expWhyReliable)}</textarea>
      </div>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 3; render();">← Tillbaka</button>
        <button type="button" class="btn-primary" onclick="finishStage4()">Kontrollera & gå till Muntligt genrep →</button>
      </div>
    </div>
  `;
}

function selectExpScenario(key) {
  state.selectedScenario = key;
  state.expTreat = '';
  state.expCtrl = '';
  state.expSame = '';
  state.expMeasure = '';
  render();
}

function finishStage4() {
  const sc = expScenarios[state.selectedScenario];
  const treat = document.getElementById('selTreat').value;
  const ctrl = document.getElementById('selCtrl').value;
  const same = document.getElementById('selSame').value;
  const measure = document.getElementById('selMeasure').value;
  const why = document.getElementById('txtExpWhy').value.trim();

  if (!treat || !ctrl || !same || !measure) {
    showToast("Gör ett val i alla fyra rullgardinsmenyer först!");
    return;
  }
  if (treat !== sc.treatOptions[0] || ctrl !== sc.ctrlOptions[0] || same !== sc.sameOptions[0] || measure !== sc.measureOptions[0]) {
    showToast("💡 Kolla era val i menyerna – ett av valen gör experimentet orättvist eller omätbart!");
    return;
  }
  if (why.length < 20) {
    showToast("Skriv minst en mening som förklarar varför kontrollgruppen behövs och varför försöket är pålitligt!");
    return;
  }

  state.expTreat = treat;
  state.expCtrl = ctrl;
  state.expSame = same;
  state.expMeasure = measure;
  state.expWhyReliable = why;
  state.stage = 5;
  state.s5Index = 0;
  state.s5Revealed = false;
  state.s5TimerVal = 45;
  render();
}

/* --- STAGE 5: MUNTLIGT GENREP --- */
function renderStage5() {
  const item = s5Questions[state.s5Index];
  const checkText = item.checklist.join(' ');

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-pair">🎤 Muntligt genrep • Fråga ${state.s5Index + 1} av ${s5Questions.length}</span>
          <h2>Träna som på riktiga provet</h2>
        </div>
        ${ttsButton(item.q, "Läs upp frågan")}
      </div>

      <div style="background: var(--bg-card-alt); border: 2px solid var(--accent); padding: 20px; border-radius: 12px; margin: 14px 0;">
        <p style="font-size: 1.25rem; font-weight: 800; margin: 0;" data-autoread="${item.q.replace(/"/g, '&quot;')}">
          ${escapeHtml(item.q)}
        </p>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0;">
        <div class="timer-pill">⏱️ Snacktid: <span id="oralTimerDisplay">${state.s5TimerVal}</span> sek</div>
        <button type="button" class="btn-secondary" onclick="startOralTimer()">▶️ Starta 45 sek timer</button>
        <span style="color: var(--text-muted); font-size: 0.95rem;">Svara högt för varandra <strong>innan</strong> ni visar facit!</span>
      </div>

      ${!state.s5Revealed ? `
        <button type="button" class="btn-primary" style="margin-top: 10px;" onclick="revealOral()">
          👀 Visa facit & E-checklista
        </button>
      ` : `
        <div class="feedback-box show ok">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div>
              <strong>✅ Det här ska finnas med för E-nivå:</strong>
              <ul style="margin: 8px 0 0 0;">
                ${item.checklist.map(c => `<li>${escapeHtml(c)}</li>`).join('')}
              </ul>
            </div>
            ${ttsButton(checkText, "Lyssna på facit")}
          </div>
        </div>

        <p style="margin-top: 18px; font-weight: 700;">Hur gick ert muntliga svar?</p>
        <div class="options-grid two-col">
          <button type="button" class="option-btn" onclick="rateOral('green')">
            🟢 Vi fick med det mesta utan problem!
          </button>
          <button type="button" class="option-btn" onclick="rateOral('yellow')">
            🟡 Vi behövde kika på checklistan (nu sitter det!)
          </button>
        </div>
      `}
    </div>
  `;
}

function startOralTimer() {
  clearInterval(oralInterval);
  state.s5TimerVal = 45;
  state.s5TimerRunning = true;
  const disp = document.getElementById('oralTimerDisplay');
  if (disp) disp.textContent = state.s5TimerVal;

  oralInterval = setInterval(() => {
    state.s5TimerVal--;
    const d = document.getElementById('oralTimerDisplay');
    if (d) d.textContent = Math.max(0, state.s5TimerVal);
    if (state.s5TimerVal <= 0) {
      clearInterval(oralInterval);
      state.s5TimerRunning = false;
      showToast("⏱️ Tiden är ute! Dags att kolla facit.");
    }
  }, 1000);
}

function revealOral() {
  clearInterval(oralInterval);
  state.s5Revealed = true;
  render();
}

function rateOral(rating) {
  state.s5Ratings[state.s5Index] = rating;
  if (state.s5Index < s5Questions.length - 1) {
    state.s5Index++;
    state.s5Revealed = false;
    state.s5TimerVal = 45;
    render();
  } else {
    state.stage = 6;
    render();
  }
}

/* --- STAGE 6: OPTIONAL C/A BONUS (PLACEBO & BLIND STUDY) --- */
function renderStage6() {
  const caIntro = "Snyggt jobbat! Ni har klarat hela grundbanan för E-nivå. Vill ni sikta mot C eller A på provet kan ni göra den här bonusuppgiften om blindstudier och placeboeffekten – annars kan ni hoppa direkt till sammanfattningen.";
  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-ca">⭐ Valfri Bonus • Sikta mot C/A</span>
          <h2>Uppgradera experimentet: Blindstudie & Placebo</h2>
        </div>
        ${ttsButton(caIntro, "Lyssna")}
      </div>

      <p data-autoread="${caIntro.replace(/"/g, '&quot;')}">
        På provets C- och A-nivå ska ni kunna ge fler motiveringar till hur ett experiment blir riktigt pålitligt när människor testas:
      </p>

      <div style="background: var(--bg-card-alt); padding: 18px; border-radius: 12px; border: 1px solid var(--border); margin: 16px 0;">
        <p><strong>Scenario:</strong> Tänk er försöket med <strong>värmevästen</strong> (eller en energidryck). Om snickarna i behandlingsgruppen <em>vet</em> att de har en superväst på sig kan de känna sig piggare och varmare bara för att de tror att den fungerar (<strong>placeboeffekt</strong>).</p>
        <p><strong>Fråga:</strong> Hur gör man en <strong>blindstudie</strong> för att motverka placeboeffekten i testet med värmevästen?</p>

        <div class="options-grid">
          <button type="button" class="option-btn ${state.caBlindAnswered ? (state.caBlindCorrect ? 'correct' : 'wrong') : ''}"
            onclick="answerCaBlind(true)">
            Båda grupperna får likadana västar på sig utan att veta om värmeslingorna är inkopplade (behandlingsgruppen får värme, kontrollgruppen får en likadan väst utan värme = placebo).
          </button>
          <button type="button" class="option-btn ${state.caBlindAnswered && !state.caBlindCorrect ? 'wrong' : ''}"
            onclick="answerCaBlind(false)">
            Man sätter ögonbindel på alla snickare medan de använder spikpistol.
          </button>
        </div>

        <div style="margin-top: 18px;">
          <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med egna ord</div>
          <label for="txtCa">C/A-utmaning: Förklara med egna ord varför en <strong>blindstudie</strong> (och många försökspersoner) gör resultatet mer pålitligt:</label>
          <textarea id="txtCa" class="no-paste" rows="3" placeholder="En blindstudie motverkar placeboeffekten genom att... Fler försökspersoner gör att...">${escapeHtml(state.caText)}</textarea>
        </div>
      </div>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="skipBonus()">
          Hoppa över bonus → Gå till sammanfattning
        </button>
        <button type="button" class="btn-primary" onclick="finishBonus()">
          Spara bonus & gå till sammanfattning →
        </button>
      </div>
    </div>
  `;
}

function answerCaBlind(isOk) {
  state.caBlindAnswered = true;
  state.caBlindCorrect = isOk;
  if (!isOk) {
    showToast("Haha, nej! Blindstudie betyder inte ögonbindel, utan att försökspersonerna inte vet om de får riktig behandling eller placebo.");
  }
  render();
}

function skipBonus() {
  state.didBonus = false;
  state.stage = 7;
  render();
}

function finishBonus() {
  const txt = document.getElementById('txtCa').value.trim();
  if (!state.caBlindCorrect && txt.length < 10) {
    showToast("Svara på flervalsfrågan eller skriv ett kort svar i rutan – eller välj 'Hoppa över bonus'.");
    return;
  }
  state.caText = txt;
  state.didBonus = true;
  state.stage = 7;
  render();
}

/* --- STAGE 7: FINAL SUMMARY & GOOGLE CLASSROOM COPY --- */
function buildSummaryReport() {
  const mins = Math.max(1, Math.round((Date.now() - state.startTime) / 60000));
  const nowStr = new Date().toLocaleDateString('sv-SE');
  const greenCount = state.s5Ratings.filter(r => r === 'green').length;
  const sc = expScenarios[state.selectedScenario];

  let lines = [
    "==================================================",
    "SAMMANFATTNING: LEKTION 2 – BYGGLABBET: RÄTTVISA TEST",
    "Kurs: Naturkunskap 1a1 (Bygg- och anläggningsprogrammet)",
    "==================================================",
    `Datum: ${nowStr}`,
    `Elever: ${state.student1} & ${state.student2}`,
    state.classGroup ? `Klass/Grupp: ${state.classGroup}` : null,
    `Arbetstid i appen: ca ${mins} min`,
    "",
    "--- RESULTAT ÖVERSIKT (E-NIVÅ) ---",
    `• Etapp 1 (Sabotage-detektiven / Rättvisa test): ${state.s1Score} / ${s1Cases.length} rätt`,
    `• Etapp 2 (Behandlings- & Kontrollgrupp): Definition ${state.s2DefCorrect ? 'Rätt' : 'Ej klar'} | Bygg-test: ${state.s2CaseScore} / ${s2Cases.length} rätt | Varför kontrollgrupp: ${state.s2WhyCorrect ? 'Rätt' : 'Ej klar'}`,
    `• Etapp 5 (Muntligt genrep): ${greenCount} / ${s5Questions.length} frågor sattes direkt vid muntlig övning`,
    "",
    "--- PARETS EGNA HYPOTESER (ETAPP 3) ---",
    "• Hypotes 1 (Fukttåligt trälim):",
    state.hypo1Text || "(Ej ifyllt)",
    "",
    "• Hypotes 2 (Värmeväst i kyla):",
    state.hypo2Text || "(Ej ifyllt)",
    "",
    "--- PARETS EXPERIMENTDESIGN (ETAPP 4) ---",
    `• Valt scenario: ${sc.name}`,
    `• Behandlingsgrupp: ${state.expTreat || '(Ej valt)'}`,
    `• Kontrollgrupp: ${state.expCtrl || '(Ej valt)'}`,
    `• Hålls lika: ${state.expSame || '(Ej valt)'}`,
    `• Mätmetod: ${state.expMeasure || '(Ej valt)'}`,
    "• Motivering (kontrollgruppens funktion & experimentets pålitlighet):",
    state.expWhyReliable || "(Ej ifyllt)",
    "",
    "--- PAR-SNACK #1 (RÄTTVISA EXPERIMENT) ---",
    state.pair1Text || "(Ej ifyllt)"
  ].filter(item => item !== null);

  if (state.didBonus) {
    lines.push(
      "",
      "--- BONUS-ETAPP (SIKTA MOT C/A) ---",
      `• Blindstudie & Placebo flerval: ${state.caBlindCorrect ? 'Rätt' : 'Försökt'}`,
      "• Egen förklaring av blindstudie & pålitlighet:",
      state.caText || "(Ej ifyllt)"
    );
  }

  lines.push(
    "",
    "==================================================",
    "Klar för inlämning i Google Classroom!"
  );

  return lines.join("\n");
}

function renderSummary() {
  const report = buildSummaryReport();
  const doneAudio = "Grymt jobbat! Ni är klara med Lektion 2. Klicka på knappen Kopiera sammanfattning och klistra in texten i ert delade dokument i Google Classroom.";

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-e">🎉 Klar! • Redo för Google Classroom</span>
          <h1>Snyggt jobbat, ${escapeHtml(state.student1)} & ${escapeHtml(state.student2)}!</h1>
        </div>
        ${ttsButton(doneAudio, "Lyssna")}
      </div>

      <p data-autoread="${doneAudio.replace(/"/g, '&quot;')}">
        Gör så här för att lämna in ert arbete från Lektion 2:
      </p>
      <ol>
        <li>Klicka på knappen <strong>”📋 Kopiera sammanfattning till Google Classroom”</strong> nedan.</li>
        <li>Öppna ert delade Google Dokument i <strong>Google Classroom</strong>.</li>
        <li>Ställ markören under Lektion 1 och tryck <strong>Ctrl + V</strong> för att klistra in.</li>
      </ol>

      <div style="margin: 18px 0;">
        <button type="button" class="btn-primary" style="width: 100%; font-size: 1.15rem; padding: 16px;" onclick="copySummaryToClipboard()">
          📋 Kopiera sammanfattning till Google Classroom
        </button>
      </div>

      <label for="summaryOutput">Er färdiga sammanfattning (förhandsvisning):</label>
      <textarea id="summaryOutput" class="summary-textarea" readonly>${escapeHtml(report)}</textarea>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 5; render();">← Tillbaka till muntliga genrepet</button>
      </div>
    </div>
  `;
}

function copySummaryToClipboard() {
  const textarea = document.getElementById('summaryOutput');
  const text = textarea.value;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopySuccess();
    }).catch(() => {
      fallbackCopy(textarea);
    });
  } else {
    fallbackCopy(textarea);
  }
}

function fallbackCopy(textarea) {
  textarea.select();
  textarea.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    showCopySuccess();
  } catch (err) {
    showToast("Markera texten i rutan och tryck Ctrl + C för att kopiera.");
  }
}

function showCopySuccess() {
  showToast("✅ Kopierat! Gå till Google Classroom och tryck Ctrl + V i ert dokument.", true);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Initial boot
render();
</script>
</body>
</html>
