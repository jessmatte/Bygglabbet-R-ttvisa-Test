<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lektion 2: Bygglabbet – Rättvisa Test – Naturkunskap 1a1</title>
  <style>
    :root {
      /* Ljust läge (Standard) */
      --bg-main: #f4f6f9;
      --bg-header: #ffffff;
      --bg-card: #ffffff;
      --bg-card-alt: #f1f5f9;
      --bg-input: #ffffff;
      --bg-completed: #f8fafc;
      --accent: #d97706;
      --accent-hover: #b45309;
      --accent-text: #ffffff;
      --blue: #0369a1;
      --blue-bg: #e0f2fe;
      --green: #15803d;
      --green-bg: #dcfce7;
      --red: #b91c1c;
      --red-bg: #fee2e2;
      --purple: #7e22ce;
      --purple-bg: #f3e8ff;
      --text-main: #0f172a;
      --text-heading: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    body.dark-mode {
      --bg-main: #12161c;
      --bg-header: #0d1117;
      --bg-card: #1b222c;
      --bg-card-alt: #232c38;
      --bg-input: #101419;
      --bg-completed: #161d26;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --accent-text: #111827;
      --blue: #38bdf8;
      --blue-bg: rgba(56, 189, 248, 0.14);
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.15);
      --red: #f87171;
      --red-bg: rgba(248, 113, 113, 0.15);
      --purple: #c084fc;
      --purple-bg: rgba(192, 132, 252, 0.15);
      --text-main: #f3f4f6;
      --text-heading: #ffffff;
      --text-muted: #cbd5e1;
      --border: #334155;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 18px;
      line-height: 1.65;
      letter-spacing: 0.012em;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Sticky Top Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-header);
      border-bottom: 2px solid var(--border);
      padding: 10px 18px;
      box-shadow: var(--shadow);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.12rem;
      color: var(--accent);
    }

    .brand-badge {
      background: var(--accent);
      color: var(--accent-text);
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Level Segmented Switch */
    .level-switch {
      display: inline-flex;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .level-btn {
      padding: 6px 11px;
      font-size: 0.86rem;
      font-weight: 800;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .level-btn.active-e {
      background-color: var(--green-bg);
      color: var(--green);
      border-color: var(--green);
    }

    .level-btn.active-ca {
      background-color: var(--purple-bg);
      color: var(--purple);
      border-color: var(--purple);
    }

    .voice-select {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      max-width: 175px;
      cursor: pointer;
    }

    .progress-wrap {
      max-width: 980px;
      margin: 8px auto 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #f59e0b);
      transition: width 0.35s ease;
    }

    /* Main Container */
    main {
      max-width: 980px;
      margin: 22px auto 64px;
      padding: 0 16px;
    }

    /* Teacher Walkthrough Panel (Shift+L) */
    .teacher-panel {
      background: linear-gradient(135deg, #1e1b4b, #172554);
      border: 2px solid #818cf8;
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      color: #f8fafc;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 1rem;
    }

    .teacher-panel-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .teacher-title {
      font-weight: 800;
      font-size: 1.1rem;
      color: #e0e7ff;
    }

    .teacher-overview-box {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(129, 140, 248, 0.45);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 10px 0 14px;
      color: #f1f5f9;
      line-height: 1.55;
    }

    .teacher-nav-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .teacher-stage-btn {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 11px;
      font-size: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
    }

    .teacher-stage-btn.active {
      background: #6366f1;
      border-color: #a5b4fc;
      color: #ffffff;
    }

    .teacher-action-btn {
      background: #312e81;
      color: #e0e7ff;
      border: 1px solid #818cf8;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    h1, h2, h3 {
      margin-top: 0;
      line-height: 1.3;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--accent);
    }

    h2 {
      font-size: 1.42rem;
      color: var(--text-heading);
    }

    h3 {
      font-size: 1.15rem;
      color: var(--accent);
    }

    .tag {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .tag-e {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .tag-ca {
      background: var(--purple-bg);
      color: var(--purple);
      border: 1px solid var(--purple);
    }

    .tag-pair {
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue);
    }

    /* Key Words Box */
    .vocab-box {
      background-color: var(--blue-bg);
      border-left: 5px solid var(--blue);
      border-radius: 10px;
      padding: 14px 18px;
      margin: 14px 0 20px;
    }

    .vocab-box-title {
      font-weight: 800;
      color: var(--blue);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .vocab-box ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }

    .vocab-box li {
      margin-bottom: 5px;
    }

    /* Stacked Completed Answers */
    .history-stack {
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-header {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .completed-card {
      background-color: var(--bg-completed);
      border: 1px solid var(--border);
      border-left: 5px solid var(--green);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .completed-q {
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .completed-a {
      background-color: var(--green-bg);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .completed-exp {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .active-question-box {
      background-color: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
    }

    /* Tap-to-Fill Sentence Builder */
    .sentence-builder {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      font-size: 1.16rem;
      font-weight: 600;
      line-height: 2.1;
      margin: 14px 0;
    }

    .blank-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 125px;
      padding: 2px 12px;
      margin: 0 4px;
      border-radius: 8px;
      border: 2px dashed var(--accent);
      background-color: var(--bg-card);
      color: var(--accent);
      font-weight: 800;
      cursor: pointer;
      vertical-align: baseline;
    }

    .blank-slot.filled {
      border-style: solid;
      background-color: var(--blue-bg);
      border-color: var(--blue);
      color: var(--blue);
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    .word-chip {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .word-chip:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .word-chip.used {
      opacity: 0.4;
      cursor: default;
    }

    /* Cooldown Banner */
    .cooldown-banner {
      background-color: var(--red-bg);
      border: 1px solid var(--red);
      color: var(--red);
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 12px;
      text-align: center;
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      padding: 12px 18px;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 1.08rem;
      padding: 14px 24px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-tts {
      background-color: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 7px 13px;
      font-size: 0.92rem;
      flex-shrink: 0;
    }

    .btn-tts:hover {
      filter: brightness(0.95);
    }

    .btn-tts.speaking {
      background-color: var(--blue);
      color: #ffffff;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(3, 105, 161, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(3, 105, 161, 0); }
      100% { box-shadow: 0 0 0 0 rgba(3, 105, 161, 0); }
    }

    /* Inputs & Starter Chips */
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"], textarea, select {
      width: 100%;
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .no-paste-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .starter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chip-btn {
      background-color: var(--bg-card);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 8px;
    }

    .chip-btn:hover {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    /* Choice Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    @media (min-width: 700px) {
      .options-grid.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--border);
      text-align: left;
      justify-content: flex-start;
      padding: 15px 18px;
      font-weight: 600;
      line-height: 1.45;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .option-btn.selected {
      border-color: var(--blue);
      background-color: var(--blue-bg);
    }

    .option-btn.correct {
      border-color: var(--green);
      background-color: var(--green-bg);
      color: var(--text-main);
    }

    .option-btn.wrong {
      border-color: var(--red);
      background-color: var(--red-bg);
      color: var(--text-main);
    }

    /* Group Builder Cards */
    .group-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin: 16px 0;
    }

    @media (min-width: 740px) {
      .group-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .group-box {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .group-box.treat {
      border-top: 5px solid var(--accent);
    }

    .group-box.ctrl {
      border-top: 5px solid var(--blue);
    }

    /* Feedback Box */
    .feedback-box {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 10px;
      border-left: 5px solid var(--blue);
      background-color: var(--bg-card-alt);
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.ok {
      border-left-color: var(--green);
      background-color: var(--green-bg);
    }

    .feedback-box.err {
      border-left-color: var(--red);
      background-color: var(--red-bg);
    }

    /* Pair Discussion Box */
    .pair-box {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--blue);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 18px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Oral Timer */
    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-card-alt);
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Toast Warning */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #991b1b;
      color: #ffffff;
      border: 2px solid #f87171;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      z-index: 9999;
      display: none;
      max-width: 90vw;
      text-align: center;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .summary-textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      min-height: 340px;
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--green);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-badge">Lektion 2 av 3</span>
      <span>Bygglabbet: Rättvisa Test</span>
    </div>
    <div class="top-controls">
      <div class="level-switch" role="group" aria-label="Välj svårighetsnivå">
        <button type="button" class="level-btn active-e" id="btnModeE" onclick="setLevelMode('E')">
          🟢 E-nivå
        </button>
        <button type="button" class="level-btn" id="btnModeCA" onclick="setLevelMode('CA')">
          🟣 C/A-nivå
        </button>
      </div>
      <select id="voiceSelect" class="voice-select" title="Välj röst för uppläsning" onchange="selectVoice(this.value)">
        <option value="">🗣️ Laddar röster...</option>
      </select>
      <button type="button" class="btn-tts" id="btnAutoTts" onclick="toggleAutoTts()">
        🔊 Auto-ljud: AV
      </button>
      <button type="button" class="btn-secondary" style="padding: 7px 10px; font-size: 0.88rem;" onclick="stopSpeech()">
        ⏹ Stopp
      </button>
      <button type="button" class="btn-secondary" id="btnTheme" style="padding: 7px 10px; font-size: 0.88rem;" onclick="toggleTheme()">
        🌙 Mörkt läge
      </button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="stageLabel">Start: Par-incheckning</span>
      <span id="timeEstimate">Ca 40 min totalt</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>
</header>

<main id="appContainer"></main>

<div id="toast"></div>

<script>
/* =========================================================
   1. NATURAL SWEDISH TEXT-TO-SPEECH (CHROMEBOOK OPTIMIZED)
   ========================================================= */
let availableSvVoices = [];
let selectedVoiceURI = '';
let autoTts = false;
let currentSpeakBtn = null;
let speechQueue = [];
let isSpeakingQueue = false;

function scoreSwedishVoice(voice) {
  const name = (voice.name || '').toLowerCase();
  const lang = (voice.lang || '').toLowerCase();
  let score = 0;

  if (lang === 'sv-se') score += 40;
  else if (lang.startsWith('sv')) score += 20;

  if (name.includes('google')) score += 100;
  if (name.includes('natural') || name.includes('neural') || name.includes('online')) score += 90;
  if (name.includes('alva') || name.includes('klara') || name.includes('oskar') || name.includes('sofie') || name.includes('mattias')) score += 70;
  if (!voice.localService) score += 30;

  if (name.includes('espeak') || name.includes('compact') || name.includes('android')) score -= 60;

  return score;
}

function loadSwedishVoices() {
  if (!('speechSynthesis' in window)) return;
  const allVoices = window.speechSynthesis.getVoices();
  if (!allVoices || allVoices.length === 0) return;

  const svVoices = allVoices
    .filter(v => (v.lang || '').toLowerCase().startsWith('sv'))
    .sort((a, b) => scoreSwedishVoice(b) - scoreSwedishVoice(a));

  availableSvVoices = svVoices;

  const selectEl = document.getElementById('voiceSelect');
  if (!selectEl) return;

  if (svVoices.length === 0) {
    selectEl.innerHTML = `<option value="">🗣️ Standardröst</option>`;
    return;
  }

  if (!selectedVoiceURI || !svVoices.some(v => v.voiceURI === selectedVoiceURI)) {
    selectedVoiceURI = svVoices[0].voiceURI;
  }

  selectEl.innerHTML = svVoices.map((v, i) => {
    const cleanName = v.name
      .replace(/Microsoft |Google |Desktop |\(Sweden\)|Swedish/gi, '')
      .trim() || `Svensk röst ${i + 1}`;
    const tag = i === 0 ? ' ⭐' : '';
    return `<option value="${escapeHtml(v.voiceURI)}" ${v.voiceURI === selectedVoiceURI ? 'selected' : ''}>🗣️ ${escapeHtml(cleanName)}${tag}</option>`;
  }).join('');
}

function selectVoice(uri) {
  selectedVoiceURI = uri;
  speakText("Hej! Så här låter den här rösten.");
}

if ('speechSynthesis' in window) {
  loadSwedishVoices();
  window.speechSynthesis.onvoiceschanged = loadSwedishVoices;
}

function stopSpeech() {
  speechQueue = [];
  isSpeakingQueue = false;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  if (currentSpeakBtn) {
    currentSpeakBtn.classList.remove('speaking');
    currentSpeakBtn = null;
  }
}

function splitIntoSentences(text) {
  const clean = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  return clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g).map(s => s.trim()).filter(Boolean);
}

function speakNextInQueue() {
  if (speechQueue.length === 0) {
    isSpeakingQueue = false;
    if (currentSpeakBtn) {
      currentSpeakBtn.classList.remove('speaking');
      currentSpeakBtn = null;
    }
    return;
  }

  const sentence = speechQueue.shift();
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = 'sv-SE';

  const chosenVoice = availableSvVoices.find(v => v.voiceURI === selectedVoiceURI) || availableSvVoices[0];
  if (chosenVoice) {
    utterance.voice = chosenVoice;
  }

  utterance.rate = 0.94;
  utterance.pitch = 1.02;

  utterance.onend = () => {
    if (isSpeakingQueue) {
      setTimeout(speakNextInQueue, 120);
    }
  };
  utterance.onerror = () => {
    stopSpeech();
  };

  window.speechSynthesis.speak(utterance);
}

function speakText(text, btnEl = null) {
  if (!('speechSynthesis' in window)) {
    showToast("Din webbläsare stöder tyvärr inte uppläsning.");
    return;
  }
  stopSpeech();
  loadSwedishVoices();

  const sentences = splitIntoSentences(text);
  if (sentences.length === 0) return;

  if (btnEl) {
    currentSpeakBtn = btnEl;
    btnEl.classList.add('speaking');
  }

  speechQueue = sentences;
  isSpeakingQueue = true;
  speakNextInQueue();
}

function speakFromBtn(btnEl) {
  const text = btnEl.getAttribute('data-tts') || '';
  speakText(text, btnEl);
}

function toggleAutoTts() {
  autoTts = !autoTts;
  const btn = document.getElementById('btnAutoTts');
  btn.textContent = autoTts ? '🔊 Auto-ljud: PÅ' : '🔊 Auto-ljud: AV';
  if (autoTts) {
    speakText("Automatisk uppläsning är nu på.");
  } else {
    stopSpeech();
  }
}

function ttsButton(textToRead, label = "Lyssna") {
  return `<button type="button" class="btn-tts" data-tts="${escapeHtml(textToRead)}" onclick="speakFromBtn(this)">🔊 ${escapeHtml(label)}</button>`;
}

let isDarkMode = false;

function toggleTheme() {
  isDarkMode = !isDarkMode;
  document.body.classList.toggle('dark-mode', isDarkMode);

  if (btn) {
    btn.textContent = isDarkMode ? '☀️ Ljust läge' : '🌙 Mörkt läge';

function setLevelMode(mode) {
  if (state.levelMode === mode) return;
  state.levelMode = mode;
  cooldownSeconds = 0;
  clearInterval(cooldownTimer);
  updateLevelButtons();
  showToast(
    mode === 'E'
      ? "🟢 E-nivå vald: korta meningar, bygg-uppgifter och kompis-check."
      : "🟣 C/A-nivå vald: fullständiga scenarier och fördjupad analys.",
    true
  );
  render();
}

function updateLevelButtons() {
  const btnE = document.getElementById('btnModeE');
  const btnCA = document.getElementById('btnModeCA');
  if (!btnE || !btnCA) return;
  btnE.className = state.levelMode === 'E' ? 'level-btn active-e' : 'level-btn';
  btnCA.className = state.levelMode === 'CA' ? 'level-btn active-ca' : 'level-btn';
}

function triggerClickCooldown(hintMessage) {
  showToast(hintMessage);
  if (state.levelMode !== 'E') return;
  cooldownSeconds = 3;
  clearInterval(cooldownTimer);
  render();
  cooldownTimer = setInterval(() => {
    cooldownSeconds--;
    if (cooldownSeconds <= 0) {
      cooldownSeconds = 0;
      clearInterval(cooldownTimer);
    }
    render();
  }, 1000);
}

/* =========================================================
   3. ANTI-PASTE & TOAST GUARDRAILS
   ========================================================= */
let toastTimeout = null;
function showToast(msg, isSuccess = false) {
  const el = document.getElementById('toast');
  el.style.backgroundColor = isSuccess ? '#14532d' : '#991b1b';
  el.style.borderColor = isSuccess ? '#22c55e' : '#f87171';
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    el.style.display = 'none';
  }, 3600);
}

function attachAntiPaste(el) {
  if (!el) return;
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    showToast("🚫 Klistra in är avstängt! Skriv svaret med era egna ord.");
  });
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    showToast("🚫 Dra-och-släpp text är avstängt! Skriv med egna ord.");
  });

  let lastVal = el.value || '';
  el.addEventListener('input', () => {
    const diff = el.value.length - lastVal.length;
    if (diff > 18) {
      el.value = lastVal;
      showToast("🚫 För många tecken på en gång! Skriv svaret själva.");
    } else {
      lastVal = el.value;
    }
  });
}

function wireAllNoPasteInputs() {
  document.querySelectorAll('.no-paste').forEach(attachAntiPaste);
}

function insertStarter(textareaId, starterText) {
  const el = document.getElementById(textareaId);
  if (!el) return;
  el.value = starterText;
  el.focus();
  el.dispatchEvent(new Event('input'));
}

/* =========================================================
   5. TEACHER WALKTHROUGH MODE (Shift+L / Shift+F)
   ========================================================= */
document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (e.shiftKey && (e.code === 'KeyL' || e.key === 'L' || e.key === 'l')) {
    e.preventDefault();
    toggleTeacherMode();
  } else if (e.shiftKey && (e.code === 'KeyF' || e.key === 'F' || e.key === 'f')) {
    e.preventDefault();
    demoForwardStep();
  }
});

function toggleTeacherMode() {
  state.teacherMode = !state.teacherMode;
  if (state.teacherMode) {
    state.teacherOverviewExpanded = true;
    showToast("📋 Lektionsöversikt visad för genomgång!", true);
  } else {
    showToast("Lektionsöversikt stängd.");
  }
  render();
}

function jumpToStage(targetStage) {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  state.stage = targetStage;
  render();
}

function demoForwardStep() {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  const isCA = state.levelMode === 'CA';
  cooldownSeconds = 0;
  clearInterval(cooldownTimer);

  if (state.stage === 0) {
    if (!state.classGroup) state.classGroup = "BA23A";
    state.stage = 1;
    render();
    return;
  }

  if (state.stage === 1) {
    const qList = isCA ? s1CasesCA : s1StepsE;
    if (state.s1Index < qList.length) {
      const step = qList[state.s1Index];
      if (!isCA && step.type === 'fill') {
        state.s1FillSlots = [...step.answers];
        checkS1Fill();
      } else {
        const correctIdx = step.options.findIndex(o => o.correct);
        answerS1(correctIdx);
      }
    } else {
      if (!state.pair1Text || state.pair1Text.length < 15) {
        state.pair1Text = "För att ett test ska vara rättvist får man bara ändra en faktor i taget, man måste ha en kontrollgrupp och försöket ska gå att upprepa.";
      }
      state.pair1PeerChecks = [true, true];
      state.stage = 2;
      render();
    }
    return;
  }

  if (state.stage === 2) {
    if (!isCA) {
      if (state.s2Index < s2StepsE.length) {
        const step = s2StepsE[state.s2Index];
        if (step.type === 'fill') {
          state.s2FillSlots = [...step.answers];
          checkS2Fill();
        } else {
          const correctIdx = step.options.findIndex(o => o.correct);
          answerS2E(correctIdx);
        }
      } else {
        state.stage = 3;
        render();
      }
    } else {
      if (!state.s2DefCorrect) {
        answerS2DefCA(true);
      } else if (state.s2CaseIndex < s2CasesCA.length) {
        if (!state.s2CaseAnswered) {
          const correctIdx = s2CasesCA[state.s2CaseIndex].options.findIndex(o => o.correct);
          answerS2CaseCA(correctIdx);
        } else if (state.s2CaseIndex < s2CasesCA.length - 1) {
          state.s2CaseIndex++;
          state.s2CaseAnswered = false;
          state.s2CaseChosenIdx = null;
          render();
        } else if (!state.s2WhyCorrect) {
          answerS2WhyCA(true);
        } else {
          state.stage = 3;
          render();
        }
      }
    }
    return;
  }

  if (state.stage === 3) {
    if (!isCA && state.s3Index < s3StepsE.length) {
      const step = s3StepsE[state.s3Index];
      if (step.type === 'fill') {
        state.s3FillSlots = [...step.answers];
        checkS3Fill();
      } else {
        const correctIdx = step.options.findIndex(o => o.correct);
        answerS3E(correctIdx);
      }
    } else if (isCA && (!state.s3Fix1Done || !state.s3Fix2Done)) {
      state.s3Fix1Done = true;
      state.s3Fix2Done = true;
      render();
    } else {
      if (!state.hypo1Text || state.hypo1Text.length < 15) {
        state.hypo1Text = "Träreglar som limmas med det nya fukttåliga limmet håller ihop bättre efter en vecka i regn än reglar med vanligt lim.";
      }
      if (!state.hypo2Text || state.hypo2Text.length < 15) {
        state.hypo2Text = "Snickare som bär en påslagen värmeväst fryser mindre och spikar fler reglar i timmen vid 0 grader än snickare utan värmeväst.";
      }
      state.pair2PeerChecks = [true, true];
      state.stage = 4;
      render();
    }
    return;
  }

  if (state.stage === 4) {
    if (!isCA) {
      const eb = expBuilderE[state.selectedScenario];
      state.expTreat = eb.steps[0].options.find(o => o.correct).text;
      state.expCtrl = eb.steps[1].options.find(o => o.correct).text;
      state.expSame = eb.steps[2].options.find(o => o.correct).text;
      state.expMeasure = eb.steps[3].options.find(o => o.correct).text;
      if (!state.expWhyReliable || state.expWhyReliable.length < 15) {
        state.expWhyReliable = eb.demoWhy;
      }
      state.expPeerChecks = [true, true];
      state.stage = 5;
      render();
    } else {
      const sc = expScenariosCA[state.selectedScenario];
      if (!state.expTreat || !state.expCtrl || !state.expSame || !state.expMeasure) {
        state.expTreat = sc.treatOptions[0];
        state.expCtrl = sc.ctrlOptions[0];
        state.expSame = sc.sameOptions[0];
        state.expMeasure = sc.measureOptions[0];
        render();
      } else {
        if (!state.expWhyReliable || state.expWhyReliable.length < 15) {
          state.expWhyReliable = sc.demoWhy;
        }
        state.stage = 5;
        render();
      }
    }
    return;
  }

  if (state.stage === 5) {
    if (!state.s5Revealed) {
      state.s5OralChecks = [true, true];
      revealOral();
    } else {
      rateOral('green');
    }
    return;
  }

  if (state.stage === 6) {
    if (!state.caBlindCorrect) {
      answerCaBlind(true);
    } else {
      if (!state.caText || state.caText.length < 10) {
        state.caText = "I en blindstudie vet inte försökspersonerna om de har en påslagen värmeväst eller en avstängd väst (placebo), så förväntningar påverkar inte resultatet.";
      }
      state.didBonus = true;
      state.stage = 7;
      render();
    }
    return;
  }

  if (state.stage === 7) {
    showToast("Ni är redan på sista sidan (Sammanfattning)!", true);
  }
}

function startApp() {

  if (!s1) {

    return;
  }
  state.student1 = s1;
  state.student2 = s2 || "Ingen parkompis angiven";
  state.classGroup = cls;
  state.startTime = Date.now();
  state.stage = 1;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function pickS1Word(word) {
  if (state.s1FillSlots[0] === null) state.s1FillSlots[0] = word;
  else if (state.s1FillSlots[1] === null) state.s1FillSlots[1] = word;
  render();
}

function clearS1Slot(idx) {
  state.s1FillSlots[idx] = null;
  render();
}

function checkS1Fill() {
  const step = s1StepsE[state.s1Index];
  if (!step || step.type !== 'fill') return;
  if (state.s1FillSlots[0] !== step.answers[0] || state.s1FillSlots[1] !== step.answers[1]) {
    state.s1FillSlots = [null, null];
    triggerClickCooldown("Inte riktigt! Titta i den blå rutan högst upp och välj rätt två ord.");
    return;
  }
  state.s1Score++;
  state.s1History.push({
    prompt: step.completedQ,
    chosenText: step.completedA,
    explanation: step.explanation
  });
  state.s1FillSlots = [null, null];
  state.s1Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function answerS1(idx) {
  if (cooldownSeconds > 0) return;
  const qList = state.levelMode === 'CA' ? s1CasesCA : s1StepsE;
  const step = qList[state.s1Index];
  const chosen = step.options[idx];
  if (!chosen.correct) {
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs alternativen noga och försök igen.");
    return;
  }
  state.s1Score++;
  state.s1History.push({
    prompt: `${step.title}: ${step.question || step.prompt}`,
    chosenText: chosen.text,
    explanation: step.explanation
  });
  state.s1Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function resetStage1() {
  state.s1Index = 0;
  state.s1Score = 0;
  state.s1History = [];
  state.s1FillSlots = [null, null];
  render();
}

function finishStage1() {
  const c1 = document.getElementById('chkPair1A').checked;
  const c2 = document.getElementById('chkPair1B').checked;
  const txt = document.getElementById('txtPair1').value.trim();
  if (!c1 || !c2) {
    showToast("Kryssa i båda kompis-checkarna när ni har pratat igenom nyckelorden högt!");
    return;
  }
  if (txt.length < 15) {
    showToast("Skriv minst en mening i rutan innan ni går vidare!");
    return;
  }
  state.pair1PeerChecks = [c1, c2];
  state.pair1Text = txt;
  state.stage = 2;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function answerS2DefCA(isOk) {
  state.s2DefAnswered = true;

  render();
}

function answerS2CaseCA(idx) {
  if (state.s2CaseAnswered) return;
  state.s2CaseAnswered = true;
  state.s2CaseChosenIdx = idx;
  if (s2CasesCA[state.s2CaseIndex].options[idx].correct) {
    state.s2CaseScore++;
  }
  render();
  if (autoTts) speakText(s2CasesCA[state.s2CaseIndex].explanation);
}

function answerS2WhyCA(isOk) {
  state.s2WhyAnswered = true;
  state.s2WhyCorrect = isOk;
  if (!isOk) showToast("Tänk efter: hur vet vi att sprayen eller sulan gjorde skillnad om vi inte har något att jämföra med?");
  render();
}

function finishStage2CA() {
  if (!state.s2DefCorrect) {
    showToast("Svara rätt på Del 1 (vad en kontrollgrupp är) först!");
    return;
  }
  if (state.s2CaseIndex < s2CasesCA.length - 1 || !state.s2CaseAnswered) {
    showToast("Gör klart båda bygg-testen i Del 2 först!");
    return;
  }
  if (!state.s2WhyCorrect) {
    showToast("Svara rätt på Del 3 (varför kontrollgruppen är viktig) först!");
    return;
  }
  state.stage = 3;
  render();
}

function pickS3Word(word) {
  if (state.s3FillSlots[0] === null) state.s3FillSlots[0] = word;
  else if (state.s3FillSlots[1] === null) state.s3FillSlots[1] = word;
  render();
}

function clearS3Slot(idx) {
  state.s3FillSlots[idx] = null;
  render();
}

function checkS3Fill() {
  const step = s3StepsE[state.s3Index];
  if (!step || step.type !== 'fill') return;
  if (state.s3FillSlots[0] !== step.answers[0] || state.s3FillSlots[1] !== step.answers[1]) {
    state.s3FillSlots = [null, null];
    triggerClickCooldown("Inte riktigt! Titta i den blå rutan och välj rätt ord.");
    return;
  }
  state.s3Score++;
  state.s3History.push({
    prompt: step.completedQ,
    chosenText: step.completedA,
    explanation: step.explanation
  });
  state.s3FillSlots = [null, null];
  state.s3Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function answerS3E(idx) {
  if (cooldownSeconds > 0) return;
  const step = s3StepsE[state.s3Index];
  const chosen = step.options[idx];
  if (!chosen.correct) {
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs alternativen noga.");
    return;
  }
  state.s3Score++;
  state.s3History.push({
    prompt: step.prompt,
    chosenText: chosen.text,
    explanation: step.explanation
  });
  state.s3Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function finishStage3() {

    return;

  const h1 = document.getElementById('txtHypo1').value.trim();
  const h2 = document.getElementById('txtHypo2').value.trim();
  const c1 = document.getElementById('chkPair2A').checked;
  const c2El = document.getElementById('chkPair2B');
  const c2 = c2El ? c2El.checked : true;

  if (h1.length < 15 || h2.length < 15) {
    showToast("Skriv båda hypoteserna i textrutorna innan ni går vidare!");
    return;
  }
  if (h1.endsWith('?') || h2.endsWith('?')) {
    showToast("Obs! En hypotes får inte sluta med frågetecken (?). Gör om till ett påstående!");
    return;

  if (!c1 || !c2) {

    return;

  state.hypo1Text = h1;
  state.hypo2Text = h2;
  state.pair2PeerChecks = [c1, c2];
  state.stage = 4;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="chkExpB" ${state.expPeerChecks[1] ? 'checked' : ''} onchange="state.expPeerChecks[1] = this.checked" />

          </label>

      </div>
    </div>
  `;
}

function pickExpCardE(stepIdx, optIdx) {
  if (cooldownSeconds > 0) return;
  const eb = expBuilderE[state.selectedScenario];
  const opt = eb.steps[stepIdx].options[optIdx];
  if (!opt.correct) {
    triggerClickCooldown(opt.trap || "Inte riktigt! Tänk på reglerna för ett rättvist test.");
    return;
  }
  if (stepIdx === 0) state.expTreat = opt.text;
  else if (stepIdx === 1) state.expCtrl = opt.text;
  else if (stepIdx === 2) state.expSame = opt.text;
  else if (stepIdx === 3) state.expMeasure = opt.text;
  render();
}

function selectExpScenario(key) {
  state.selectedScenario = key;
  state.expTreat = '';
  state.expCtrl = '';
  state.expSame = '';
  state.expMeasure = '';
  render();
}

function finishStage4() {
  const isCA = state.levelMode === 'CA';
  if (!isCA) {
    if (!state.expTreat || !state.expCtrl || !state.expSame || !state.expMeasure) {
      showToast("Klicka fram rätt kort på alla fyra stegen ovan först!");
      return;
    }
    const c1 = document.getElementById('chkExpA').checked;
    const c2 = document.getElementById('chkExpB').checked;
    if (!c1 || !c2) {
      showToast("Kryssa i båda kompis-checkarna när ni har pratat igenom försöket högt!");
      return;
    }
    const why = document.getElementById('txtExpWhy').value.trim();
    if (why.length < 15) {
      showToast("Skriv minst en mening som förklarar varför kontrollgruppen behövs!");
      return;
    }
    state.expPeerChecks = [c1, c2];
    state.expWhyReliable = why;
  } else {
    const sc = expScenariosCA[state.selectedScenario];
    const treat = document.getElementById('selTreat').value;
    const ctrl = document.getElementById('selCtrl').value;
    const same = document.getElementById('selSame').value;
    const measure = document.getElementById('selMeasure').value;
    const why = document.getElementById('txtExpWhy').value.trim();

    if (!treat || !ctrl || !same || !measure) {
      showToast("Gör ett val i alla fyra rullgardinsmenyer först!");
      return;
    }
    if (treat !== sc.treatOptions[0] || ctrl !== sc.ctrlOptions[0] || same !== sc.sameOptions[0] || measure !== sc.measureOptions[0]) {
      showToast("💡 Kolla era val i menyerna – ett av valen gör experimentet orättvist eller omätbart!");
      return;
    }
    if (why.length < 20) {
      showToast("Skriv minst en mening som förklarar varför kontrollgruppen behövs och varför försöket är pålitligt!");
      return;
    }
    state.expTreat = treat;
    state.expCtrl = ctrl;
    state.expSame = same;
    state.expMeasure = measure;
    state.expWhyReliable = why;
  }

  state.stage = 5;
  state.s5Index = 0;
  state.s5Revealed = false;
  state.s5OralChecks = [false, false];
  state.s5TimerVal = 45;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 5: MUNTLIGT GENREP --- */

      ${state.s5ShowNotes ? `

            <div>
              <strong>✅ Det här ska finnas med på provet:</strong>
              <ul style="margin: 8px 0 0 0;">
                ${item.checklist.map(c => `<li>${escapeHtml(c)}</li>`).join('')}
              </ul>
            </div>
            ${ttsButton(checkText, "Lyssna på facit")}
          </div>
        </div>

        <p style="margin-top: 18px; font-weight: 700;">Hur gick ert muntliga svar?</p>
        <div class="options-grid two-col">
          <button type="button" class="option-btn" onclick="rateOral('green')">
            🟢 Vi fick med nyckelorden utan problem!
          </button>
          <button type="button" class="option-btn" onclick="rateOral('yellow')">
            🟡 Vi behövde kika på checklistan (nu sitter det!)
          </button>
        </div>
      `}

function startOralTimer() {
  clearInterval(oralInterval);
  state.s5TimerVal = 45;
  state.s5TimerRunning = true;
  const disp = document.getElementById('oralTimerDisplay');
  if (disp) disp.textContent = state.s5TimerVal;

  oralInterval = setInterval(() => {
    state.s5TimerVal--;
    const d = document.getElementById('oralTimerDisplay');
    if (d) d.textContent = Math.max(0, state.s5TimerVal);
    if (state.s5TimerVal <= 0) {
      clearInterval(oralInterval);
      state.s5TimerRunning = false;
      showToast("⏱️ Tiden är ute! Dags att kolla facit.");
    }
  }, 1000);
}

function revealOral() {
  if (state.levelMode === 'E') {
    if (!state.s5OralChecks[0] || !state.s5OralChecks[1]) {
      showToast("Svara högt först och kryssa i båda nyckelorden innan ni öppnar facit!");
      return;
    }
  }
  clearInterval(oralInterval);
  state.s5Revealed = true;
  render();
}

function rateOral(rating) {
  const qList = state.levelMode === 'CA' ? s5QuestionsCA : s5QuestionsE;
  state.s5Ratings[state.s5Index] = rating;
  if (state.s5Index < qList.length - 1) {
    state.s5Index++;
    state.s5Revealed = false;
    state.s5OralChecks = [false, false];
    state.s5TimerVal = 45;
    render();
  } else {
    state.stage = 6;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }
}

        <p><strong>Fråga:</strong> Hur gör man en <strong>blindstudie</strong> för att motverka placeboeffekten i testet med värmevästen?</p>

function answerCaBlind(isOk) {
  state.caBlindAnswered = true;
  state.caBlindCorrect = isOk;
  if (!isOk) {
    showToast("Haha, nej! Blindstudie betyder inte ögonbindel, utan att försökspersonerna inte vet om de får riktig behandling eller placebo.");
  }
  render();
}

function skipBonus() {
  state.didBonus = false;
  state.stage = 7;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function finishBonus() {
  const txt = document.getElementById('txtCa').value.trim();
  if (!state.caBlindCorrect && txt.length < 10) {
    showToast(
      state.levelMode === 'CA'
        ? "Svara rätt på flervalsfrågan och skriv en kort motivering i rutan!"
        : "Svara på flervalsfrågan eller skriv ett kort svar i rutan – eller välj 'Hoppa över bonus'."
    );

  state.caText = txt;

  window.scrollTo({ top: 0, behavior: 'smooth' });

}

/* --- STAGE 7: FINAL SUMMARY & GOOGLE CLASSROOM COPY --- */
function buildSummaryReport() {
  const isCA = state.levelMode === 'CA';
  const mins = Math.max(1, Math.round((Date.now() - state.startTime) / 60000));
  const nowStr = new Date().toLocaleDateString('sv-SE');
  const q1Len = isCA ? s1CasesCA.length : s1StepsE.length;
  const s5Len = isCA ? s5QuestionsCA.length : s5QuestionsE.length;
  const greenCount = state.s5Ratings.filter(r => r === 'green').length;
  const scName = isCA ? expScenariosCA[state.selectedScenario].name : expBuilderE[state.selectedScenario].name;

  const s2SummaryLine = isCA
    ? `• Etapp 2 (Behandlings- & Kontrollgrupp): Definition ${state.s2DefCorrect ? 'Rätt' : 'Ej klar'} | Bygg-test: ${state.s2CaseScore} / ${s2CasesCA.length} rätt | Varför kontrollgrupp: ${state.s2WhyCorrect ? 'Rätt' : 'Ej klar'}`
    : `• Etapp 2 (Behandlings- & Kontrollgrupp): ${state.s2Score} / ${s2StepsE.length} klara`;

  let lines = [
    "==================================================",
    "SAMMANFATTNING: LEKTION 2 – BYGGLABBET: RÄTTVISA TEST",
    "Kurs: Naturkunskap 1a1 (Bygg- och anläggningsprogrammet)",
    "==================================================",
    `Datum: ${nowStr}`,
    `Elever: ${state.student1} & ${state.student2}`,
    state.classGroup ? `Klass/Grupp: ${state.classGroup}` : null,
    `Vald nivå i appen: ${isCA ? 'C/A-nivå' : 'E-nivå'}`,
    `Arbetstid i appen: ca ${mins} min`,
    "",
    "--- RESULTAT ÖVERSIKT ---",
    `• Etapp 1 (Sabotage-detektiven / Rättvisa test): ${state.s1Score} / ${q1Len} rätt`,
    s2SummaryLine,
    `• Etapp 5 (Muntligt genrep): ${greenCount} / ${s5Len} frågor sattes direkt vid muntlig övning`,
    "",
    "--- PARETS EGNA HYPOTESER (ETAPP 3) ---",
    "• Hypotes 1 (Fukttåligt trälim):",
    state.hypo1Text || "(Ej ifyllt)",
    "",
    "• Hypotes 2 (Värmeväst i kyla):",
    state.hypo2Text || "(Ej ifyllt)",
    "",
    "--- PARETS EXPERIMENTDESIGN (ETAPP 4) ---",
    `• Valt scenario: ${scName}`,
    `• Behandlingsgrupp: ${state.expTreat || '(Ej valt)'}`,
    `• Kontrollgrupp: ${state.expCtrl || '(Ej valt)'}`,
    `• Hålls lika: ${state.expSame || '(Ej valt)'}`,
    `• Mätmetod: ${state.expMeasure || '(Ej valt)'}`,
    "• Motivering (kontrollgruppens funktion & experimentets pålitlighet):",
    state.expWhyReliable || "(Ej ifyllt)",
    "",
    "--- PAR-SNACK #1 (RÄTTVISA EXPERIMENT) ---",
    state.pair1Text || "(Ej ifyllt)"
  ].filter(item => item !== null);

  if (state.didBonus) {
    lines.push(
      "",
      "--- FÖRDJUPNING (C/A-NIVÅ) ---",
      `• Blindstudie & Placebo flerval: ${state.caBlindCorrect ? 'Rätt' : 'Försökt'}`,
      "• Egen förklaring av blindstudie & pålitlighet:",
      state.caText || "(Ej ifyllt)"
    );
  }

  lines.push(
    "",
    "==================================================",
    "Klar för inlämning i Google Classroom!"
  );

  return lines.join("\n");
}

        <li>Klicka på knappen <strong>”📋 Kopiera sammanfattning till Google Classroom”</strong> nedan.</li>
        <li>Öppna ert delade Google Dokument i <strong>Google Classroom</strong>.</li>
        <li>Ställ markören under Lektion 1 och tryck <strong>Ctrl + V</strong> för att klistra in.</li>
      </ol>

      <div style="margin: 18px 0;">
        <button type="button" class="btn-primary" style="width: 100%; font-size: 1.15rem; padding: 16px;" onclick="copySummaryToClipboard()">
          📋 Kopiera sammanfattning till Google Classroom
        </button>
      </div>

      <label for="summaryOutput">Er färdiga sammanfattning (förhandsvisning):</label>
      <textarea id="summaryOutput" class="summary-textarea" readonly>${escapeHtml(report)}</textarea>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 5; window.scrollTo({top:0, behavior:'smooth'}); render();">← Tillbaka till muntliga genrepet</button>
      </div>
    </div>
  `;
}

function copySummaryToClipboard() {
  const textarea = document.getElementById('summaryOutput');
  const text = textarea.value;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopySuccess();
    }).catch(() => {
      fallbackCopy(textarea);
    });
  } else {
    fallbackCopy(textarea);
  }
}

function fallbackCopy(textarea) {
  textarea.select();
  textarea.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    showCopySuccess();
  } catch (err) {
    showToast("Markera texten i rutan och tryck Ctrl + C för att kopiera.");
  }
}

function showCopySuccess() {
  showToast("✅ Kopierat! Gå till Google Classroom och tryck Ctrl + V i ert dokument.", true);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Initial boot
render();
setTimeout(loadSwedishVoices, 300);
</script>
</body>
